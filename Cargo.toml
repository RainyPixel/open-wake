[package]
name = "open-wake"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
description = "Run or observe local work and wake Codex without model-side polling"
license = "MIT"
readme = "README.md"
keywords = ["codex", "hooks", "automation", "cli"]
categories = ["command-line-utilities", "development-tools"]
repository = "https://github.com/RainyPixel/open-wake"
homepage = "https://github.com/RainyPixel/open-wake"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
humantime = "2.3"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
toml_edit = "0.25.13"

[profile.release]
strip = true
lto = "thin"
