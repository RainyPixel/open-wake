name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      pr: ${{ steps.release_pr.outputs.pr }}
      prs_created: ${{ steps.release_pr.outputs.prs_created }}
      release_created: ${{ steps.release.outputs.release_created }}
      release_sha: ${{ steps.release.outputs.sha }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true
      - id: release_pr
        if: steps.release.outputs.release_created != 'true'
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

  release-pr-ci:
    needs: release-please
    if: needs.release-please.outputs.prs_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch CI for the release PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PR: ${{ needs.release-please.outputs.pr }}
        run: |
          branch="$(jq -r '.headBranchName // empty' <<<"$RELEASE_PR")"
          test -n "$branch"
          gh workflow run ci.yml --ref "$branch"

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.release_sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        shell: bash
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          test "v$version" = "$RELEASE_TAG"
      - name: Test
        run: cargo test --locked
      - name: Build release binary
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Package
        shell: bash
        run: |
          asset="open-wake-${{ matrix.target }}.tar.gz"
          mkdir staging
          cp "target/${{ matrix.target }}/release/open-wake" staging/open-wake
          cp README.md LICENSE staging/
          chmod 0755 staging/open-wake
          tar -C staging -czf "$asset" open-wake README.md LICENSE
          shasum -a 256 "$asset" >"$asset.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: open-wake-${{ matrix.target }}
          path: |
            open-wake-${{ matrix.target }}.tar.gz
            open-wake-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  publish:
    needs:
      - release-please
      - build
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Build checksum manifest
        run: |
          cat dist/*.sha256 | sort --key=2 >dist/SHA256SUMS
          rm dist/*.sha256
      - name: Upload assets and publish draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
